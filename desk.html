<!doctype html><html lang="ru"><meta charset="utf-8"><title>Doorlist · Касса</title><style>body{font:18px/1.5 system-ui;max-width:520px;margin:10vh auto;padding:22px;background:#f5f0e6;color:#272521}button,input{font:inherit;padding:6px}output{display:block;margin:24px 0}</style><main><h1>Камерный концерт</h1><p>Свободно мест: <b id="left">…</b></p><form><label>Количество <input type="number" min="1" max="6" value="1" required></label> <button disabled>Забронировать</button></form><output aria-live="polite"></output></main><script>
const show=new URLSearchParams(location.search).get('show'),url='/shows/'+encodeURIComponent(show),btn=document.querySelector('button'),msg=document.querySelector('output');
let pending=null;async function refresh(){const r=await fetch(url);if(!r.ok)throw Error();document.querySelector('#left').textContent=(await r.json()).remaining;btn.disabled=false;}refresh().catch(()=>msg.textContent='Сеанс не найден');
document.querySelector('form').onsubmit=async e=>{e.preventDefault();btn.disabled=true;const qty=Number(document.querySelector('input').value);if(!pending||pending.qty!==qty)pending={request_id:crypto.randomUUID(),qty};try{const r=await fetch(url+'/tickets',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(pending)});if(r.ok){pending=null;msg.textContent='Бронь подтверждена';}else{msg.textContent=r.status===409?'Недостаточно мест':'Ошибка заявки';}await refresh();}catch{msg.textContent='Нет связи. Повторите запрос.';}finally{btn.disabled=false;}};
</script></html>
