<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doorlist QA · Протокол прогона</title><style>*{box-sizing:border-box}body{margin:0;background:#eee9df;color:#29251f;font:17px/1.55 system-ui}main{max-width:880px;background:#fffcf5;padding:clamp(22px,6vw,65px);margin:25px auto;border-top:7px solid #993c28}h1{font:normal clamp(44px,8vw,80px)/1 Georgia,serif;margin:20px 0}h2{font-size:21px;border-top:1px dashed #9a9384;padding-top:12px}.meta,time{font:14px monospace}li{margin:5px 0;overflow-wrap:anywhere}.pass{color:#17613c}.fail{color:#993c28}a{color:inherit}footer{display:flex;gap:1rem;flex-wrap:wrap;border-top:1px solid;padding-top:16px;margin-top:24px}</style><main><header class="meta">DOORLIST / ПРОВЕРКА КАССЫ</header><h1>Протокол прогона</h1><p>Проверяем покупку последнего билета, повтор запроса и сохранение брони после перезагрузки.</p><h2 id="result" aria-live="polite">Загрузка отчёта…</h2><time></time><div id="suites"></div><footer><a href="receipt.json">JSON</a><a href="https://github.com/dreddxyz/doorlist-qa/actions">Журнал CI</a><a href="https://github.com/dreddxyz/doorlist-qa">Код</a></footer></main><script>fetch('receipt.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{document.querySelector('#result').textContent=d.ok?'Проверки прошли':'Есть сбои';document.querySelector('time').textContent=new Date(d.at).toISOString().slice(0,16).replace('T',' ')+' UTC · '+d.sha.slice(0,7);for(const s of d.suites){const h=document.createElement('h2');h.textContent=s.suite;const ul=document.createElement('ul');for(const c of s.cases){const li=document.createElement('li');li.className=c.outcome==='pass'?'pass':'fail';li.textContent=c.name+' · '+c.outcome+' · '+c.seconds.toFixed(2)+' с';ul.append(li);}document.querySelector('#suites').append(h,ul);}}).catch(()=>document.querySelector('#result').textContent='Отчёт недоступен');</script></html>
